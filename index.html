<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CrescentConneKt — launching soon</title>
<meta name="description" content="One Crescent. Many institutions. One connected network. Launching soon.">
<meta name="robots" content="noindex, follow">

<meta property="og:type" content="website">
<meta property="og:title" content="CrescentConneKt">
<meta property="og:description" content="One Crescent. Many institutions. One connected network. Launching soon.">
<meta property="og:url" content="https://crescentconnekt.com/">
<meta name="twitter:card" content="summary_large_image">

<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%2312305B'/><circle cx='21.5' cy='13' r='11.5' fill='%23FBFAF8'/></svg>">

<style>
  :root{
    --navy:#12305B;
    --navy-deep:#0B1E3D;
    --red:#C8102E;
    --slate:#5D6879;
    --paper:#FBFAF8;
  }

  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}

  body{
    background:var(--paper);
    color:var(--navy-deep);
    font-family:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
    min-height:100svh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:clamp(28px,7vw,72px);
    position:relative;
    overflow:hidden;
  }

  /* one large, quiet crescent anchoring the page */
  .crescent{
    position:fixed;
    right:-14vmax;
    bottom:-20vmax;
    width:78vmax;
    height:78vmax;
    pointer-events:none;
    opacity:0;
    animation:bloom 2.4s cubic-bezier(.2,.7,.3,1) .2s forwards;
  }
  .crescent svg{width:100%;height:100%;display:block}

  main{
    position:relative;
    text-align:center;
    max-width:min(760px,100%);
  }

  .mark{
    font-size:clamp(38px,7.4vw,76px);
    line-height:1;
    letter-spacing:-.028em;
    font-weight:600;
    color:var(--navy);
    margin:0;
  }
  .mark .k{color:var(--red)}

  .tagline{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
    font-size:clamp(14px,2.1vw,18px);
    line-height:1.55;
    color:var(--slate);
    margin:clamp(20px,3vw,28px) auto 0;
    max-width:34ch;
  }

  .rule{
    width:44px;
    height:1px;
    background:var(--red);
    border:0;
    margin:clamp(34px,5vw,48px) auto clamp(18px,2.6vw,24px);
    opacity:.55;
  }

  .soon{
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    font-size:clamp(13px,1.7vw,15px);
    letter-spacing:.02em;
    color:var(--navy);
    margin:0;
  }

  .rise{opacity:0;animation:rise .9s cubic-bezier(.22,.68,.28,1) forwards}

  @keyframes rise{
    from{opacity:0;transform:translateY(16px)}
    to{opacity:1;transform:none}
  }
  @keyframes bloom{to{opacity:1}}

  @media (max-width:600px){
    .crescent{right:-30vmax;bottom:-30vmax;width:96vmax;height:96vmax}
  }

  @media (prefers-reduced-motion:reduce){
    .rise,.crescent{animation:none!important;opacity:1!important;transform:none!important}
  }
</style>
</head>

<body>

  <div class="crescent" aria-hidden="true">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <mask id="cut">
          <rect width="100" height="100" fill="#000"/>
          <circle cx="50" cy="50" r="42" fill="#fff"/>
          <circle cx="66" cy="38" r="38" fill="#000"/>
        </mask>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0%"  stop-color="#12305B" stop-opacity=".085"/>
          <stop offset="100%" stop-color="#12305B" stop-opacity=".025"/>
        </linearGradient>
      </defs>
      <rect width="100" height="100" fill="url(#g)" mask="url(#cut)"/>
    </svg>
  </div>

  <main>
    <h1 class="mark rise" style="animation-delay:.15s">Crescent<span class="k">Conne</span>Kt</h1>

    <p class="tagline rise" style="animation-delay:.34s">
      One Crescent. Many institutions.<br>One connected network.
    </p>

    <hr class="rule rise" style="animation-delay:.52s">

    <p class="soon rise" style="animation-delay:.6s">Launching soon</p>
  </main>

</body>
</html>
